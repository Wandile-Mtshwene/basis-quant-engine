[project]
name = "basis"
version = "0.1.0"
description = "Open-core actuarial pricing engine for life and funeral assurance, built on real public mortality tables."
authors = [
    { name = "Wandile Mtshwene", email = "mtshwenewesley@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pymort>=2.0.1",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "formulas>=1.3.4",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
